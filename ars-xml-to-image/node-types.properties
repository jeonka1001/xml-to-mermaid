# HansolXmlToImage2 변환 규칙 (UTF-8)
# 지정 방법: --rules node-types.properties 또는 -Dhansol.rules=node-types.properties
# 이 파일의 값은 내장 기본값에 덮어써집니다. 재컴파일 없이 규칙을 추가할 수 있습니다.

# NodeType -> 도형
#   rect, round, stadium, subroutine, cylinder, circle, doublecircle, asymmetric,
#   diamond, hexagon, parallelogram, parallelogram-alt, trapezoid, trapezoid-alt
# StartNode(stadium), ScriptNode(rect) 는 Java 규칙 클래스(rule/StartNodeRule, ScriptNodeRule)로 내장되어 있습니다.
# 여기에 같은 NodeType 을 적으면 클래스 규칙 대신 이 줄이 적용됩니다.
# 로그에 "NodeType 'XXX'" 가 보고되면 의미를 확인한 뒤 추가하십시오. 예:
# nodetype.MenuNode=diamond

# 목록에 없는 NodeType 을 그릴 도형
fallback.shape=rect

# 확인된 Diagram@Version (쉼표 구분)
diagram.versions=14

# 알고 있지만 변환에 쓰지 않는 요소/속성 (쉼표 구분). 로그에서 UNKNOWN 대신 IGNORED 로 분류됩니다.
#   요소: 이름 (모든 위치에 적용)   예) CustomProperties,Script
#   속성: 요소@속성 또는 *@속성      예) Node@X,Node@Y,*@Color
ignore.elements=CustomProperties,Script
ignore.attributes=
